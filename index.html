<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sài Gòn qua năm tháng — lofi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* look: enamel street-name plates (blue + white) for the eras, a cream "radio" card for the music */
:root {
  --plate: #1d4f91; --plate-2: #173f75; --white: #fbf7ec; --cream: #f6ead0; --paper: #efe0c0; --ink: #33261f; --soft: #7a6654;
  --tile: #c4583a; --leaf: #3f8a4e; --sun: #f2b63a; --shadow: rgba(51, 38, 31, .55);
  --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #2a2622; color: var(--ink); font-family: var(--font); font-size: 14px; font-weight: 500; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; touch-action: none; }
#cv:active { cursor: grabbing; }
button { font: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* --- era plate --- */
#hud { position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; max-width: calc(100% - 28px); }
#eras { background: var(--plate); border: 3px solid var(--white); outline: 3px solid var(--plate); border-radius: 8px; padding: 6px 8px 7px; box-shadow: 4px 5px 0 var(--shadow); }
#eras .cap { color: var(--white); font-size: 10.5px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; opacity: .85; padding: 0 2px 4px; }
#eras .tabs { display: flex; gap: 5px; }
#eras button { min-width: 58px; min-height: 40px; padding: 0 8px; background: var(--plate-2); color: var(--white); font-weight: 800; font-size: 17px; letter-spacing: .5px; border-radius: 5px; border: 2px solid transparent; }
#eras button:hover { border-color: var(--white); }
#eras button[aria-pressed="true"] { background: var(--white); color: var(--plate); }
#info { background: var(--cream); border-radius: 6px; padding: 5px 10px 6px; box-shadow: 3px 4px 0 var(--shadow); pointer-events: none; }
#eraSub { font-weight: 700; font-size: 13px; }
#status { font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
#ticker { background: var(--ink); color: var(--cream); border-radius: 6px; padding: 6px 11px; font-size: 13px; opacity: 0; pointer-events: none; max-width: min(420px, 100%); }
#ticker.show { animation: tick 5.5s ease both; }
@keyframes tick { 0% { opacity: 0; transform: translateX(-6px); } 6%, 85% { opacity: .96; transform: none; } 100% { opacity: 0; } }

/* --- music card --- */
#dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(560px, calc(100% - 28px)); background: var(--cream); border-radius: 12px; border-top: 7px solid var(--tile); box-shadow: 4px 6px 0 var(--shadow); padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 7px; align-items: center; }
#dock button { min-height: 40px; padding: 0 11px; background: var(--paper); color: var(--ink); font-weight: 700; border-radius: 8px; box-shadow: 0 2px 0 #cdb98f; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
#dock button:hover { background: #e6d3aa; }
#dock button[aria-pressed="true"] { background: var(--leaf); color: var(--white); box-shadow: 0 2px 0 #2c6238; }
#dock button svg { width: 18px; height: 18px; fill: currentColor; }
#play { width: 48px; min-height: 48px !important; border-radius: 50% !important; background: var(--tile) !important; color: var(--white) !important; box-shadow: 0 3px 0 #8f3c26 !important; flex: none; position: relative; padding: 0 !important; }
#play .ipause { display: none; } #play.playing .ipause { display: block; } #play.playing .iplay { display: none; }
#hint { position: absolute; left: -2px; bottom: 58px; white-space: nowrap; padding: 5px 10px; font-size: 12.5px; font-weight: 700; background: var(--sun); color: var(--ink); border-radius: 6px; pointer-events: none; animation: bob 1.6s ease-in-out infinite; }
#hint.gone { display: none; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.trk { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.trk .names { min-width: 0; flex: 1; }
#tname { font-weight: 800; font-size: 16px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tnum { font-size: 11.5px; color: var(--soft); }
#viz { width: 60px; height: 21px; image-rendering: pixelated; flex: none; }
.sq { width: 42px; padding: 0 !important; flex: none; }
.seg { display: flex; gap: 5px; flex: 1; min-width: 0; }
.seg button { flex: 1; min-width: 0; padding: 0 5px !important; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
#panel { display: flex; flex-direction: column; gap: 8px; padding-top: 9px; border-top: 2px dashed #cdb98f; }
#panel[hidden] { display: none; }
.lab { width: 74px; flex: none; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--soft); }
.sl { flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--soft); min-width: 0; }
input[type=range] { width: 100%; height: 24px; margin: 0; accent-color: var(--tile); }
#ytUrl { flex: 1; min-width: 0; height: 40px; padding: 0 10px; font: inherit; color: var(--ink); background: var(--white); border: 2px solid #cdb98f; border-radius: 8px; -webkit-user-select: text; user-select: text; }
#ytMsg { font-size: 12px; color: var(--soft); min-height: 16px; } #ytMsg.bad { color: #a8321e; font-weight: 700; }
/* YouTube player: kept visible, 200x200 is the minimum size YouTube asks for */
#ytbox { position: absolute; right: 14px; bottom: 14px; width: 212px; background: var(--cream); border-radius: 10px; border-top: 7px solid var(--plate); box-shadow: 4px 6px 0 var(--shadow); padding: 6px; }
#ytbox[hidden] { display: none; }
#ytbox .bar { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--soft); padding: 0 2px 5px; }
#ytOff { min-height: 28px; padding: 0 8px; background: var(--paper); color: var(--ink); font-weight: 700; border-radius: 6px; font-size: 12px; }
#ytplayer, #ytbox iframe { display: block; width: 200px; height: 200px; border: 0; background: #1c1a18; }
#fade { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--card, #f6ead0); color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .45s ease; text-align: center; padding: 16px; }
#fade.on { opacity: 1; }
#fadeT { font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: 1px; color: var(--plate); }
#fadeS { font-size: 15px; font-weight: 700; }
#fadeBar { width: min(240px, 60%); height: 8px; margin-top: 8px; background: rgba(51, 38, 31, .16); border-radius: 4px; overflow: hidden; }
#fadeB { height: 100%; width: 0; background: var(--tile); }
body.clean #hud, body.clean #dock { display: none; }
@media (min-width: 900px) { #dock { width: min(600px, calc(100% - 480px)); min-width: 520px; } }
@media (max-width: 700px) { #ytbox { bottom: auto; top: 14px; } .lab { width: 100%; } .wrap { flex-wrap: wrap; } #eras button { min-width: 50px; font-size: 15px; } #prev { display: none; } .seg.two { flex-wrap: wrap; } .seg.two button { flex: 1 1 40%; } }
@media (prefers-reduced-motion: reduce) { #hint { animation: none; } #fade { transition: none; } }
</style>
</head>
<body>
<canvas id="cv" aria-label="Góc phố Sài Gòn đang chuyển động qua các thời kỳ"></canvas>
<div id="hud">
  <div id="eras" role="group" aria-label="Chọn thời kỳ">
    <div class="cap">Sài Gòn qua năm tháng</div>
    <div class="tabs"><button data-era="0">199x</button><button data-era="1">200x</button><button data-era="2">201x</button><button data-era="3">202x</button></div>
  </div>
  <div id="info"><div id="eraSub">Sài Gòn thập niên 90</div><div id="status">Xuân · 07:30 · trời quang</div></div>
  <div id="ticker" role="status" aria-live="polite"></div>
</div>
<div id="dock">
  <div class="row">
    <button id="play" aria-label="Bật / tắt nhạc"><span id="hint">Bấm để bật nhạc</span>
      <svg class="iplay" viewBox="0 0 12 12"><path d="M3.5 1.5v9l7-4.5z"/></svg>
      <svg class="ipause" viewBox="0 0 12 12"><rect x="2.5" y="1.5" width="2.6" height="9"/><rect x="6.9" y="1.5" width="2.6" height="9"/></svg>
    </button>
    <div class="trk"><div class="names"><div id="tname">Cà phê sữa đá</div><div id="tnum">bản 1/6</div></div><canvas id="viz" width="40" height="14"></canvas></div>
    <button id="prev" class="sq" aria-label="Bài trước"><svg viewBox="0 0 12 12"><rect x="1.5" y="2" width="2" height="8"/><path d="M10.5 2v8l-6-4z"/></svg></button>
    <button id="next" class="sq" aria-label="Bài kế tiếp"><svg viewBox="0 0 12 12"><path d="M1.5 2v8l6-4z"/><rect x="8.5" y="2" width="2" height="8"/></svg></button>
    <button id="more" class="sq" aria-label="Mở bảng tuỳ chỉnh" aria-expanded="false"><svg viewBox="0 0 12 12"><circle cx="2.5" cy="6" r="1.4"/><circle cx="6" cy="6" r="1.4"/><circle cx="9.5" cy="6" r="1.4"/></svg></button>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Chọn mùa">
      <button data-season="spring"><span class="dot" style="background:#f39abf"></span>Xuân</button><button data-season="summer"><span class="dot" style="background:#6fb03c"></span>Hạ</button><button data-season="fall"><span class="dot" style="background:#e0853a"></span>Thu</button><button data-season="winter"><span class="dot" style="background:#bfd8ee"></span>Đông</button>
    </div>
    <button id="autoSeason" aria-pressed="false" title="Tự chuyển mùa sau mỗi 2 phút rưỡi">Tự đổi</button>
  </div>
  <div id="panel" hidden>
    <div class="row wrap"><div class="lab">YouTube</div><input id="ytUrl" type="url" inputmode="url" placeholder="Dán link playlist YouTube…" aria-label="Đường dẫn playlist YouTube"><button id="ytGo">Phát</button></div>
    <div class="row"><div class="lab"></div><div id="ytMsg">Dán playlist rồi bấm Phát. Nhạc lofi của game vẫn giữ nguyên.</div></div>
    <div class="row wrap"><div class="lab">Giờ</div><div class="seg" role="group" aria-label="Thời gian trong ngày">
      <button data-time="auto">Tự chạy</button><button data-time="morning">Sáng</button><button data-time="noon">Trưa</button><button data-time="dusk">Chiều tà</button><button data-time="night">Đêm</button></div></div>
    <div class="row wrap"><div class="lab">Thời tiết</div><div class="seg" role="group" aria-label="Thời tiết">
      <button data-wx="auto">Tự nhiên</button><button data-wx="clear">Quang</button><button data-wx="rain"><span id="wxRainL">Mưa</span></button><button data-wx="wind">Gió</button></div></div>
    <div class="row wrap"><div class="lab">Âm phố</div><button id="streetOn" aria-pressed="true" title="Tiếng chuông, còi xe, tiếng rao… tách riêng khỏi nhạc">Bật</button><label class="sl" for="vStreet">Tiếng đường phố<input id="vStreet" type="range" min="0" max="100"></label><button id="tetBtn" aria-pressed="false" title="Hoa mai và đèn lồng (phím T)">Tết</button></div>
    <div class="row wrap"><div class="lab">Âm lượng</div>
      <label class="sl" for="vMusic">Nhạc<input id="vMusic" type="range" min="0" max="100"></label>
      <label class="sl" for="vAmb">Âm nền<input id="vAmb" type="range" min="0" max="100"></label>
      <label class="sl" for="vVinyl">Đĩa than<input id="vVinyl" type="range" min="0" max="100"></label></div>
    <div class="row wrap"><div class="lab">Khung nhìn</div><div class="seg two">
      <button id="viewRiver" title="Bay tới bến sông (phím B)">Bến sông</button><button id="zout">Thu nhỏ</button><button id="zin">Phóng to</button><button id="full">Toàn màn hình</button><button id="hide">Ẩn bảng</button></div></div>
  </div>
</div>
<div id="ytbox" hidden><div class="bar"><span>YouTube</span><button id="ytOff" title="Tắt YouTube, quay về nhạc lofi của game">Tắt</button></div><div id="ytplayer"></div></div>
<div id="fade" class="on" aria-hidden="true"><div id="fadeT">Sài Gòn qua năm tháng</div><div id="fadeS">đang dựng góc phố…</div><div id="fadeBar"><div id="fadeB"></div></div></div>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/build.js"></script>
<script src="js/landmarks.js"></script>
<script src="js/eras.js"></script>
<script src="js/city.js"></script>
<script src="js/sim.js"></script>
<script src="js/river.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/yt.js"></script>
<script src="js/main.js"></script>
</body>
</html>
