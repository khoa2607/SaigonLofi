<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sài Gòn qua năm tháng — lofi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lofi-ui.css">
<style>
/* look: enamel street-name plates (blue + white) for the eras, a cream "radio" card for the music */
:root {
  --plate: #1d4f91; --plate-2: #173f75; --white: #fbf7ec; --cream: #f6ead0; --paper: #efe0c0; --ink: #33261f; --soft: #7a6654;
  --tile: #c4583a; --leaf: #3f8a4e; --sun: #f2b63a; --shadow: rgba(51, 38, 31, .55);
  --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #2a2622; color: var(--ink); font-family: var(--font); font-size: 14px; font-weight: 500; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; touch-action: none; }
#cv:active { cursor: grabbing; }

#fade { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--card, #f6ead0); color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .45s ease; text-align: center; padding: 16px; }
#fade.on { opacity: 1; }
#fadeT { font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: 1px; color: var(--plate); }
#fadeS { font-size: 15px; font-weight: 700; }
#fadeBar { width: min(240px, 60%); height: 8px; margin-top: 8px; background: rgba(51, 38, 31, .16); border-radius: 4px; overflow: hidden; }
#fadeB { height: 100%; width: 0; background: var(--tile); }
@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }

:root { --ink: #2b1a16; --cream: #fbead0; --paper: #f7d9af; --peach: #f9b574; --clay: #c8734f; --brown: #513733; --wood: #8a5a3e; --jade: #4f8e8a; --soft: #7a5a48;
  --tile: #c8734f; --leaf: #4f8e8a; --sun: #f9b574; --white: #fff6e6; --plate: #6e4430; --plate-2: #8a5a3e; --shadow: #2b1a16;
  --font: 'Baloo 2', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
html, body { background: #2b1a16; }
#fade { background: radial-gradient(circle at 50% 42%, #fbead0, #f2cf9c); }
#fadeT { color: var(--brown); font-weight: 800; text-shadow: 0 3px 0 #e8b47a; }
#fadeBar { height: 12px; border: 2px solid var(--ink); border-radius: 3px; background: #f2d6aa; }
#fadeB { background: repeating-linear-gradient(90deg, var(--clay) 0 6px, #b05f40 6px 8px); }


/* ===== Lofi Worlds main menu ("windows at dusk") ===== */
#menu { position: fixed; inset: 0; z-index: 60; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; color: #fbead0; font-family: 'Baloo 2', system-ui, sans-serif; font-variant-ligatures: none; -webkit-user-select: none; user-select: none;
  background: radial-gradient(120% 70% at 50% -10%, #4a3040 0%, #2a1d26 45%, #1d1520 80%) fixed, #1d1520; transition: opacity .5s ease; }
#menu[hidden] { display: none; } #menu.leaving { opacity: 0; pointer-events: none; }
body.menu #hud, body.menu #dock, body.menu #lang, body.menu #ytbox { visibility: hidden; }
#mdust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
#menu canvas { image-rendering: pixelated; display: block; }
.mhdr { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 48px; }
.mmark { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 26px; letter-spacing: .5px; }
.mmark i { width: 22px; height: 22px; flex: none; border-radius: 50%; background: #f9b574; box-shadow: inset -4px -4px 0 #d98f52, 0 0 18px rgba(249, 181, 116, .45); }
.mctl { display: flex; gap: 10px; align-items: center; }
.mpill { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 14px 0 6px; border-radius: 21px; background: rgba(251, 234, 208, .08); border: 1px solid rgba(251, 234, 208, .16); font-size: 14px; color: #d9c0a4; }
.mpill b { color: #fbead0; font-weight: 600; }
#mplay { width: 32px; height: 32px; border-radius: 50%; background: #f9b574; color: #2b1a16; display: grid; place-items: center; border: 0; padding: 0; }
#mplay svg { width: 13px; height: 13px; fill: currentColor; } #mplay .ip { display: none; } #mplay.playing .ip { display: block; } #mplay.playing .ipl { display: none; }
#mbars { display: flex; gap: 2px; align-items: flex-end; height: 14px; } #mbars span { width: 3px; height: 3px; background: #6fb3a8; border-radius: 1px; }
#mbars.on span { animation: mbar 1.1s ease-in-out infinite; } #mbars.on span:nth-child(2) { animation-delay: -.3s; } #mbars.on span:nth-child(3) { animation-delay: -.6s; } #mbars.on span:nth-child(4) { animation-delay: -.85s; }
@keyframes mbar { 0%, 100% { height: 4px; } 50% { height: 14px; } }
.mlang { display: flex; height: 42px; border-radius: 21px; border: 1px solid rgba(251, 234, 208, .16); overflow: hidden; }
.mlang button { min-width: 44px; padding: 0 12px; background: transparent; color: #b49d8c; font-weight: 700; font-size: 13px; border: 0; }
.mlang button[aria-pressed="true"] { background: #fbead0; color: #2b1a16; }
.mintro { position: relative; z-index: 2; text-align: center; padding: 34px 24px 6px; }
.mintro h1 { margin: 0; font-weight: 800; font-size: 54px; line-height: 1.05; letter-spacing: -.5px; color: #fbead0; text-shadow: 0 4px 0 #120c12, 0 0 40px rgba(249, 181, 116, .22); }
.mintro p { margin: 14px auto 0; max-width: 540px; font-size: 18px; color: #d9c0a4; }
#mcont { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; min-height: 44px; padding: 0 6px 0 16px; border-radius: 22px; background: rgba(111, 179, 168, .14); border: 1px solid rgba(111, 179, 168, .45); color: #fbead0; font-size: 15px; font-family: inherit; }
#mcont[hidden] { display: none; } #mcont small { color: #6fb3a8; font-weight: 700; letter-spacing: 1px; font-size: 11px; text-transform: uppercase; }
#mcont em { font-style: normal; background: #6fb3a8; color: #2b1a16; border-radius: 16px; padding: 3px 12px; font-weight: 700; }
#mgal { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, 300px); gap: 40px 36px; justify-content: center; padding: 42px 24px 56px; }
.mcard { position: relative; display: block; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; }
.mart { position: relative; display: block; width: 300px; height: 300px; border-radius: 10px; padding: 6px; background: #120c12; border: 2px solid rgba(251, 234, 208, .14); box-shadow: 0 10px 0 rgba(0, 0, 0, .28); transition: transform .25s ease, box-shadow .25s ease; transform-origin: center; }
.mart canvas { width: 100%; height: 100%; border-radius: 5px; }
.mcard .mt { display: block; margin: 14px 2px 0; font-weight: 700; font-size: 20px; line-height: 1.15; color: #fbead0; }
.mcard .md { display: block; margin: 4px 2px 0; font-size: 14.5px; color: #b49d8c; line-height: 1.35; }
.mbadge { position: absolute; top: 16px; left: 16px; font-size: 12px; font-weight: 700; letter-spacing: .6px; padding: 3px 10px; border-radius: 12px; }
.mbadge.live { background: #f9b574; color: #2b1a16; box-shadow: 0 2px 0 #9a5a32; }
.mbadge.live::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3a8a5a; margin-right: 6px; vertical-align: 1px; }
.mbadge.soon { background: rgba(29, 21, 32, .82); color: #d9c0a4; border: 1px solid rgba(251, 234, 208, .2); }
.mcard.soon { cursor: default; } .mcard.soon canvas { filter: saturate(.35) brightness(.62) contrast(.95); }
.mcard.soon .mt { color: #d9c0a4; } .mcard.soon .md { color: #8f7a6c; }
.mcard.live .mart { border-color: rgba(249, 181, 116, .55); }
.menter { position: absolute; right: 16px; bottom: 16px; background: #fbead0; color: #2b1a16; font-weight: 800; font-size: 14px; padding: 6px 14px; border-radius: 16px; box-shadow: 0 3px 0 #2b1a16; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
.mtip { position: absolute; left: 16px; right: 16px; bottom: 16px; background: rgba(29, 21, 32, .92); border: 1px solid rgba(251, 234, 208, .2); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; color: #d9c0a4; opacity: 0; transition: opacity .2s; }
@media (hover: hover) { .mcard.live:hover .mart { transform: translateY(-6px); box-shadow: 0 16px 0 rgba(0, 0, 0, .3), 0 0 0 2px #f9b574, 0 0 48px rgba(249, 181, 116, .45); } .mcard.live:hover .menter { opacity: 1; transform: none; } .mcard.soon:hover .mart { transform: translateY(-2px); } .mcard.soon:hover .mtip { opacity: 1; } }
#menu .mcard:focus, #menu .mcard:focus-visible { outline: none; } .mcard:focus-visible .mart { outline: 3px solid #fbead0; outline-offset: 5px; } .mcard.live:focus-visible .menter { opacity: 1; transform: none; } .mcard.soon:focus-visible .mtip { opacity: 1; }
.mcard.live:active .mart { transform: translateY(2px); box-shadow: 0 4px 0 rgba(0, 0, 0, .3), 0 0 0 2px #f9b574; }
.mcard.peek .mtip { opacity: 1; }
.mcard.zoom { z-index: 10; } .mcard.zoom .mart { transition: transform .55s cubic-bezier(.6, 0, .3, 1), box-shadow .3s; box-shadow: 0 0 0 2px #f9b574, 0 0 80px rgba(249, 181, 116, .6); } .mcard.zoom .mbadge, .mcard.zoom .menter { opacity: 0; }
.mfoot { position: relative; z-index: 2; text-align: center; padding: 0 16px 36px; font-size: 13px; color: #8f7a6c; }
@media (max-width: 1060px) { #mgal { grid-template-columns: repeat(2, 300px); } }
@media (max-width: 720px) {
  .mhdr { padding: 12px 16px; background: rgba(29, 21, 32, .88); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(251, 234, 208, .08); }
  .mmark { font-size: 19px; gap: 8px; } .mmark i { width: 16px; height: 16px; }
  .mpill { height: 38px; padding: 0 10px 0 4px; } .mpill .mtt { display: none; } #mplay { width: 30px; height: 30px; } .mlang { height: 38px; } .mlang button { min-width: 40px; padding: 0 9px; }
  .mintro { padding: 22px 16px 0; } .mintro h1 { font-size: 30px; line-height: 1.15; } .mintro p { font-size: 15px; }
  #mcont { font-size: 13px; margin-top: 16px; }
  #mgal { grid-template-columns: repeat(2, 1fr); gap: 22px 14px; padding: 24px 16px 40px; }
  .mart { width: 100%; height: auto; aspect-ratio: 1; padding: 4px; }
  .mcard .mt { font-size: 15.5px; margin-top: 9px; } .mcard .md { font-size: 12.5px; }
  .mbadge { top: 10px; left: 10px; font-size: 10.5px; padding: 2px 8px; }
  .mcard.live { grid-column: 1 / -1; } .mcard.live .mt { font-size: 19px; } .mcard.live .md { font-size: 14px; }
  .mcard.live .menter { opacity: 1; transform: none; right: 12px; bottom: 12px; }
  .mtip { left: 8px; right: 8px; bottom: 8px; font-size: 12px; padding: 6px 8px; }
}
/* Holdfast opens in its own frame above everything; the shared YouTube player must stay visible above it */
.wframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 9000; background: #1d1a20; }
body.wfopen #ytbox { visibility: visible; position: fixed; z-index: 9500; }   /* same bottom-right spot as in Saigon (the shared rules place it) */
body.wfopen #hud, body.wfopen #dock, body.wfopen #lang { visibility: hidden; }
</style>
</head>
<body>
<canvas id="cv" aria-label="Góc phố Sài Gòn đang chuyển động qua các thời kỳ" data-i18n-attr="aria-label:canvas"></canvas>
<div id="lang" role="group" aria-label="Ngôn ngữ giao diện" data-i18n-attr="aria-label:lang.group"><button data-lang="vi" lang="vi" aria-pressed="true" title="Tiếng Việt" data-i18n-attr="title:lang.vi">VI</button><button data-lang="en" lang="en" aria-pressed="false" title="English" data-i18n-attr="title:lang.en">EN</button></div>
<div id="hud">
  <button id="toMenu" data-i18n-attr="title:menu.back.t;aria-label:menu.back.t"><i></i><span data-i18n="menu.back">Lofi Worlds</span></button>
  <div id="eras" role="group" aria-label="Chọn thời kỳ" data-i18n-attr="aria-label:era.group">
    <div class="cap" data-i18n="era.cap">Sài Gòn qua năm tháng</div>
    <div class="tabs"><button data-era="0">199x</button><button data-era="1">200x</button><button data-era="2">201x</button><button data-era="3">202x</button></div>
  </div>
  <div id="info"><div id="eraSub">Sài Gòn thập niên 90</div><div id="status">Xuân · 07:30 · trời quang</div></div>
  <div id="ticker" role="status" aria-live="polite"></div>
</div>
<div id="dock">
  <div class="row">
    <button id="play" aria-label="Bật / tắt nhạc" data-i18n-attr="aria-label:play"><span id="hint" data-i18n="hint">Bấm để bật nhạc</span>
      <svg class="iplay" viewBox="0 0 12 12"><path d="M3.5 1.5v9l7-4.5z"/></svg>
      <svg class="ipause" viewBox="0 0 12 12"><rect x="2.5" y="1.5" width="2.6" height="9"/><rect x="6.9" y="1.5" width="2.6" height="9"/></svg>
    </button>
    <div class="trk"><div class="names"><div id="tname">Cà phê sữa đá</div><div id="tnum">bản 1/6</div></div><canvas id="viz" width="40" height="14"></canvas></div>
    <button id="prev" class="sq" aria-label="Bài trước" data-i18n-attr="aria-label:prev"><svg viewBox="0 0 12 12"><rect x="1.5" y="2" width="2" height="8"/><path d="M10.5 2v8l-6-4z"/></svg></button>
    <button id="next" class="sq" aria-label="Bài kế tiếp" data-i18n-attr="aria-label:next"><svg viewBox="0 0 12 12"><path d="M1.5 2v8l6-4z"/><rect x="8.5" y="2" width="2" height="8"/></svg></button>
    <button id="more" class="sq" aria-label="Mở bảng tuỳ chỉnh" data-i18n-attr="aria-label:more" aria-expanded="false"><svg viewBox="0 0 12 12"><circle cx="2.5" cy="6" r="1.4"/><circle cx="6" cy="6" r="1.4"/><circle cx="9.5" cy="6" r="1.4"/></svg></button>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Chọn mùa" data-i18n-attr="aria-label:season.group">
      <button data-season="spring"><span class="dot" style="background:#f39abf"></span><span data-i18n="season.spring">Xuân</span></button><button data-season="summer"><span class="dot" style="background:#6fb03c"></span><span data-i18n="season.summer">Hạ</span></button><button data-season="fall"><span class="dot" style="background:#e0853a"></span><span data-i18n="season.fall">Thu</span></button><button data-season="winter"><span class="dot" style="background:#bfd8ee"></span><span data-i18n="season.winter">Đông</span></button>
    </div>
    <button id="autoSeason" aria-pressed="false" title="Tự chuyển mùa sau mỗi 2 phút rưỡi" data-i18n-attr="title:autoSeason.t" data-i18n="autoSeason">Tự đổi</button>
  </div>
  <div id="panel" hidden>
    <div class="row wrap"><div class="lab">YouTube</div><input id="ytUrl" type="url" inputmode="url" placeholder="Dán link playlist YouTube…" aria-label="Đường dẫn playlist YouTube" data-i18n-attr="placeholder:yt.ph;aria-label:yt.aria"><button id="ytGo" data-i18n="yt.go">Phát</button></div>
    <div class="row"><div class="lab"></div><div id="ytMsg">Dán playlist rồi bấm Phát. Nhạc lofi của game vẫn giữ nguyên.</div></div>
    <div class="row wrap"><div class="lab" data-i18n="time.lab">Giờ</div><div class="seg" role="group" aria-label="Thời gian trong ngày" data-i18n-attr="aria-label:time.group">
      <button data-time="auto" data-i18n="time.auto">Tự chạy</button><button data-time="morning" data-i18n="time.morning">Sáng</button><button data-time="noon" data-i18n="time.noon">Trưa</button><button data-time="dusk" data-i18n="time.dusk">Chiều tà</button><button data-time="night" data-i18n="time.night">Đêm</button></div></div>
    <div class="row wrap"><div class="lab" data-i18n="ev.lab">Sự kiện</div><div class="seg" role="group" aria-label="Sự kiện lễ hội" data-i18n-attr="aria-label:ev.group">
      <button data-ev="none" aria-pressed="true" title="Ngày thường, không trang trí" data-i18n-attr="title:ev.none.t" data-i18n="ev.none">Thường</button><button id="tetBtn" data-ev="tet" aria-pressed="false" title="Hoa mai và đèn lồng (phím T)" data-i18n-attr="title:tet.t" data-i18n="tet">Tết</button><button data-ev="qk" aria-pressed="false" title="Quốc khánh 2/9: cờ và pháo hoa, chỉ ban đêm (phím Q)" data-i18n-attr="title:ev.qk.t" data-i18n="ev.qk">2/9</button><button data-ev="hw" aria-pressed="false" title="Halloween: hoá trang và bí ngô, chỉ ban đêm (phím O)" data-i18n-attr="title:ev.hw.t" data-i18n="ev.hw">Halloween</button><button data-ev="xm" aria-pressed="false" title="Giáng sinh: cây thông và đèn, chỉ ban đêm (phím X)" data-i18n-attr="title:ev.xm.t" data-i18n="ev.xm">Noel</button></div></div>
    <div class="row wrap"><div class="lab" data-i18n="wx.lab">Thời tiết</div><div class="seg" role="group" aria-label="Thời tiết" data-i18n-attr="aria-label:wx.group">
      <button data-wx="auto" data-i18n="wx.auto">Tự nhiên</button><button data-wx="clear" data-i18n="wx.clear">Quang</button><button data-wx="rain"><span id="wxRainL" data-i18n="wx.rain">Mưa</span></button><button data-wx="wind" data-i18n="wx.wind">Gió</button></div></div>
    <div class="row wrap"><div class="lab" data-i18n="street.lab">Âm phố</div><button id="streetOn" aria-pressed="true" title="Tiếng chuông, còi xe, tiếng rao… tách riêng khỏi nhạc" data-i18n-attr="title:street.t">Bật</button><label class="sl" for="vStreet"><span data-i18n="street.vol">Tiếng đường phố</span><input id="vStreet" type="range" min="0" max="100"></label></div>
    <div class="row wrap"><div class="lab" data-i18n="vol.lab">Âm lượng</div>
      <label class="sl" for="vMusic"><span data-i18n="vol.music">Nhạc</span><input id="vMusic" type="range" min="0" max="100"></label>
      <label class="sl" for="vAmb"><span data-i18n="vol.amb">Âm nền</span><input id="vAmb" type="range" min="0" max="100"></label>
      <label class="sl" for="vVinyl"><span data-i18n="vol.vinyl">Đĩa than</span><input id="vVinyl" type="range" min="0" max="100"></label></div>
    <div class="row wrap"><div class="lab" data-i18n="view.lab">Khung nhìn</div><div class="seg two">
      <button id="viewRiver" title="Bay tới bến sông (phím B)" data-i18n-attr="title:view.river.t">Bến sông</button><button id="zout" data-i18n="zout">Thu nhỏ</button><button id="zin" data-i18n="zin">Phóng to</button><button id="full" data-i18n="full">Toàn màn hình</button><button id="hide" data-i18n="hide">Ẩn bảng</button></div></div>
  </div>
</div>
<div id="ytbox" hidden><div class="bar"><span>YouTube</span><button id="ytOff" title="Tắt YouTube, quay về nhạc lofi của game" data-i18n-attr="title:yt.off.t" data-i18n="yt.off">Tắt</button></div><div id="ytplayer"></div></div>
<div id="menu" hidden>
  <canvas id="mdust" aria-hidden="true"></canvas>
  <header class="mhdr"><div class="mmark"><i></i>Lofi Worlds</div>
    <div class="mctl"><div class="mpill"><button id="mplay" data-i18n-attr="aria-label:menu.play;title:menu.play"><svg class="ipl" viewBox="0 0 12 12"><path d="M3.5 1.5v9l7-4.5z"/></svg><svg class="ip" viewBox="0 0 12 12"><rect x="2.5" y="1.5" width="2.6" height="9"/><rect x="6.9" y="1.5" width="2.6" height="9"/></svg></button><span id="mbars" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="mtt"><b id="mtrack"></b> · <span id="mstate"></span></span></div>
      <div class="mlang" role="group" data-i18n-attr="aria-label:lang.group"><button data-mlang="vi" lang="vi">VI</button><button data-mlang="en" lang="en">EN</button></div></div></header>
  <section class="mintro"><h1 data-i18n="menu.h1"></h1><p data-i18n="menu.sub"></p><button id="mcont" hidden><small data-i18n="menu.cont"></small><span id="mcontT"></span><em data-i18n="menu.cont.go"></em></button></section>
  <section id="mgal" aria-label="Lofi Worlds"></section>
  <footer class="mfoot" data-i18n="menu.foot"></footer>
</div>
<div id="fade" class="on" aria-hidden="true"><div id="fadeT" data-i18n="era.cap">Sài Gòn qua năm tháng</div><div id="fadeS" data-i18n="load.sub">đang dựng góc phố…</div><div id="fadeBar"><div id="fadeB"></div></div></div>
<script src="js/i18n.js"></script>
