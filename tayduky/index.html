<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tây Du Ký — Huyền Thoại Sống</title>
<style>
  :root { --bg: #e8e2ef; --plate: rgba(42, 23, 38, .84); --gold: #e8b03a; --fg: #f6ecd8; --muted: #c9b8a0; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); }
  canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; touch-action: none; }
  #hud { position: absolute; left: 16px; top: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--plate); padding: 8px 10px; border-radius: 8px; max-width: calc(100% - 52px); }
  #hud b { color: var(--gold); margin-right: 4px; }
  #hud button, #hud select { background: #3a2a34; color: var(--fg); border: 1px solid #6a5060; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #hud label { color: var(--muted); font-size: 12px; display: flex; gap: 4px; align-items: center; }
  #card { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); background: var(--plate); border: 2px solid var(--gold); border-radius: 8px;
          padding: 6px 20px; text-align: center; opacity: 0; transition: opacity .9s; pointer-events: none; max-width: calc(100% - 40px); }
  #card b { display: block; font-size: 19px; color: var(--gold); } #card span { color: var(--muted); font-size: 12px; }
  #load { position: absolute; inset: 0; display: grid; place-items: center; color: #6a5070; font-size: 15px; background: var(--bg); }
</style>
</head>
<body>
<canvas id="c" aria-label="Tây Du Ký: a living isometric map of eleven legendary places"></canvas>
<div id="hud">
  <b>Tây Du Ký — Huyền Thoại Sống</b>
  <button id="zin" title="Phóng to">＋</button><button id="zout" title="Thu nhỏ">－</button>
  <select id="tod" title="Giờ trong ngày"><option value="auto">Tự chạy</option><option value="day">Ngày</option><option value="dusk">Chiều tà</option><option value="night">Đêm</option></select>
  <label><input id="names" type="checkbox" checked> Tên địa danh</label>
</div>
<div id="card"><b></b><span></span></div>
<div id="load">Đang dựng thế giới…</div>
<script src="tw-palm.js"></script>
<script src="tw-map.js"></script>
<script src="chars/chars.js"></script>
<script src="sprites/sprites.js"></script>
<script src="tw-data.js"></script>
<script src="tw-sim.js"></script>
<script src="tw-palm-data.js"></script>
<script src="tw-art.js"></script>
<script src="tw-palm-art.js"></script>
<script src="tw-fx.js"></script>
<script src="tw-palm-fx.js"></script>
<script src="tw-render.js"></script>
<script src="tw-main.js"></script>
</body>
</html>
